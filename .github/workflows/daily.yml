name: update-daily

on:
  schedule:
    - cron: "47 7 * * 1-5"    # 16:47 KST weekdays, after the 15:30 KST close
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "requirements.txt"
      - ".github/workflows/daily.yml"
      - "REFRESH"

permissions:
  contents: write

concurrency:
  group: update-daily
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Previous data (universe persistence, fallback on fetch failure)
        run: |
          git clone -q --depth 1 -b data "https://github.com/${{ github.repository }}.git" "${{ runner.temp }}/prev" || mkdir -p "${{ runner.temp }}/prev"

      - name: Fetch
        env:
          OUT_DIR: ${{ runner.temp }}/out
          PREV_DIR: ${{ runner.temp }}/prev
        run: python scripts/fetch_kr.py

      # data branch is a single orphan commit, force-pushed each run: repo size stays flat
      - name: Publish to data branch
        env:
          OUT_DIR: ${{ runner.temp }}/out
        run: |
          cd "$OUT_DIR"
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "daily $(jq -r '.last_daily_close // "probe"' meta.json 2>/dev/null || echo probe)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data
